services:
  graft:
    build: .
    container_name: graft
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - RUST_LOG=graft=info
      - GRAFT_HOST=0.0.0.0
      # Listening on all interfaces needs a password; put it in a .env file next to this one.
      - GRAFT_PASSWORD=${GRAFT_PASSWORD:?set GRAFT_PASSWORD in a .env file next to docker-compose.yml}
      - GRAFT_PORT=3000
